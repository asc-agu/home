<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>地域研究愛好会 | 青山学院大学</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#16241F; --ink-soft:#5D6F68;
    --accent:#1C7A6B; --paper:#FFFFFF; --paper-deep:#F1F6F3;
    --line: rgba(22,36,31,0.14); --radius:9px;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#E9EFEC; --ink-soft:#9FB0A9; --accent:#4FC3AE;
      --paper:#0F1613; --paper-deep:#161F1B; --line: rgba(233,239,236,0.16);
    }
  }
  :root[data-theme="dark"]{
    --ink:#E9EFEC; --ink-soft:#9FB0A9; --accent:#4FC3AE;
    --paper:#0F1613; --paper-deep:#161F1B; --line: rgba(233,239,236,0.16);
  }
  html{scroll-padding-top:52px; scroll-behavior:smooth; height:100%;}
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100%; background:var(--paper); color:var(--ink);
    font-family:'Urbanist','Noto Sans JP',sans-serif; line-height:1.7;
  }
  h1,h2{font-family:'Urbanist','Noto Sans JP',sans-serif; font-weight:700;}
  a{color:inherit;}
  .wrap{max-width:760px;margin:0 auto;padding:0 20px;}

  header{ border-bottom:1px solid var(--line); padding:9px 0; background:var(--paper); position:sticky; top:0; z-index:20; }
  header .wrap{display:flex; justify-content:space-between; align-items:center;}
  .brand{ text-decoration:none; line-height:1.05; }
  .brand small{display:block; font-size:11px; letter-spacing:.02em; color:var(--ink-soft);}
  .brand strong{display:block; font-size:16px; font-weight:700; margin-top:1px;}
  nav{display:flex; gap:16px; font-size:13px;}
  nav a{text-decoration:none; padding-bottom:2px; border-bottom:2px solid transparent; cursor:pointer;}
  nav a.active{border-color:var(--accent); color:var(--accent);}

  .hero{background:var(--paper-deep);}
  .strip-track{ display:flex; overflow-x:auto; scroll-snap-type:x mandatory; -webkit-overflow-scrolling:touch; }
  .strip-track::-webkit-scrollbar{height:0;}
  .photo-card{
    flex:0 0 100%; aspect-ratio:16/9; scroll-snap-align:start;
    background-size:cover; background-position:center; display:block;
  }
  .dots{display:flex; justify-content:center; gap:6px; padding:9px 0;}
  .dot{width:5px;height:5px;border-radius:50%;background:var(--line);}
  .dot.on{background:var(--accent);}

  section{padding:22px 0;}
  section + section{border-top:1px solid var(--line);}
  .section-head{margin-bottom:12px;}
  .section-head h2{font-size:16px; margin:0;}

  .info-row{display:flex; gap:12px; padding:9px 0; border-bottom:1px dashed var(--line); font-size:13.5px; align-items:baseline;}
  .info-row:last-child{border-bottom:none;}
  .info-row time{color:var(--ink-soft); flex:0 0 auto; font-variant-numeric:tabular-nums;}
  .tag{font-size:10.5px; border:1px solid var(--accent); color:var(--accent); padding:1px 6px; border-radius:20px; flex:0 0 auto;}
  .info-row a{text-decoration:underline; text-underline-offset:3px;}

  .research-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:9px;}
  .research-card{ border:1px solid var(--line); border-radius:var(--radius); padding:14px 8px; text-align:center; text-decoration:none; display:flex; flex-direction:column; gap:4px; align-items:center; justify-content:center; transition:border-color .15s; }
  .research-card:hover{border-color:var(--accent);}
  .research-card .glyph{font-size:14px; color:var(--accent); font-weight:700; letter-spacing:.01em;}
  .research-card .ja{font-size:11px; color:var(--ink-soft);}
  @media (max-width:520px){.research-grid{grid-template-columns:1fr;} .research-card{flex-direction:row; justify-content:flex-start; padding:11px 14px; gap:8px;}}

  .latest-inline{margin-top:14px;}
  .latest-label{font-size:11px; color:var(--ink-soft); letter-spacing:.04em;}
  .latest-compact{margin-top:6px;}
  .latest-compact a{display:flex; justify-content:space-between; gap:10px; font-size:13px; padding:6px 0; text-decoration:none; border-bottom:1px dashed var(--line);}
  .latest-compact a:last-child{border-bottom:none;}
  .latest-compact a:hover{color:var(--accent);}
  .latest-compact .d{color:var(--ink-soft); font-size:11.5px; flex:0 0 auto;}

  #about h1{font-size:22px; margin:6px 0 16px;}
  #about p{font-size:14.5px; max-width:34em;}
  dl.facts{margin-top:18px; font-size:13.5px; border-top:1px solid var(--line);}
  dl.facts div{display:flex; gap:16px; padding:8px 0; border-bottom:1px solid var(--line);}
  dl.facts dt{flex:0 0 84px; color:var(--ink-soft);}
  .note{font-size:11.5px; color:var(--ink-soft); margin-top:14px;}
  .join{ margin-top:20px; display:inline-flex; align-items:center; gap:8px; border:1px solid var(--ink); border-radius:var(--radius); padding:10px 22px; text-decoration:none; font-size:14px; font-weight:600; transition:background .15s, color .15s; }
  .join:hover{background:var(--ink); color:var(--paper);}

  footer{padding:18px 0 36px; font-size:11.5px; color:var(--ink-soft);}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <a class="brand" id="brand-link" href="#top"><small>青山学院大学</small><strong>地域研究愛好会</strong></a>
    <nav>
      <a data-go="top" class="active">Home</a>
      <a data-go="about">About</a>
    </nav>
  </div>
</header>

<a id="top"></a>
<div class="hero">
  <div class="strip-track" id="strip"></div>
  <div class="dots" id="dots"></div>
</div>

<div class="wrap">
  <section>
    <div class="section-head"><h2>Information</h2></div>
    <div id="info-list"></div>
  </section>

  <section>
    <div class="section-head"><h2>Research</h2></div>
    <div class="research-grid" id="research-grid"></div>
    <div class="latest-inline">
      <span class="latest-label">Latest</span>
      <div class="latest-compact" id="latest-list"></div>
    </div>
  </section>

  <section id="about">
    <h1 id="about-title"></h1>
    <p id="about-body"></p>
    <dl class="facts" id="about-facts"></dl>
    <p class="note" id="about-note"></p>
    <a class="join" id="about-join" href="#">Join &gt;</a>
  </section>
</div>

<footer><div class="wrap" id="footer-text"></div></footer>

<script type="application/json" id="site-data">
{
  "photos": [
    {"src":"","href":"#"},
    {"src":"","href":"#"},
    {"src":"","href":"#"},
    {"src":"","href":"#"},
    {"src":"","href":"#"}
  ],
  "info": [
    {"date":"2026.09.25","tag":"Notice","text":"ホームページを公開いたしました","href":"#about"}
  ],
  "research": [
    {"glyph":"Maps","ja":"言語世界地図・民族世界地図","href":"#"},
    {"glyph":"Areas","ja":"地域別で見る","href":"#"},
    {"glyph":"Categories","ja":"テーマ別で見る","href":"#"}
  ],
  "latest": [
    {"title":"インドネシア宗教概論","date":"2026.09.25","href":"#"},
    {"title":"上座部仏教と大乗仏教","date":"2026.09.25","href":"#"}
  ],
  "about": {
    "title":"地域研究愛好会って？",
    "paragraph":["地域研究を愛する者のためのサークルです。","言語が好き、文化が好き、地理が好き、という方にはピッタリ！","研究対象は外国でも、日本でも、地域は問いません。","必要なのは地域研究への熱意のみ。","どうぞお気軽にお問い合わせください。"],
    "facts":[{"label":"設立","value":"2026年6月"},{"label":"入会条件","value":"特になし（弊学以外の方の入会も歓迎いたします）"},{"label":"活動日","value":"月2回（不定）"}],
    "note":"＊本会は非公認サークルです（2026年9月現在）。",
    "joinLabel":"Join",
    "joinHref":"#"
  },
  "footer":"© 2026 地域研究愛好会, Aoyama Gakuin University"
}
</script>

<script>
const DATA = JSON.parse(document.getElementById('site-data').textContent);
const FALLBACK_COLORS = ['#1C7A6B','#2A6FA8','#3B8F5A','#2F6F8F','#1F8073'];

const strip = document.getElementById('strip');
DATA.photos.forEach(function(p, i){
  const a = document.createElement('a');
  a.className='photo-card'; a.href = p.href || '#';
  if(p.src){ a.style.backgroundImage = 'url(' + p.src + ')'; }
  else{ a.style.backgroundColor = FALLBACK_COLORS[i % FALLBACK_COLORS.length]; }
  strip.appendChild(a);
});

document.getElementById('info-list').innerHTML = DATA.info.map(function(i){
  return '<div class="info-row"><time>' + i.date + '</time><span class="tag">' + i.tag + '</span><a href="' + i.href + '">' + i.text + '</a></div>';
}).join('');

document.getElementById('research-grid').innerHTML = DATA.research.map(function(r){
  return '<a class="research-card" href="' + r.href + '"><span class="glyph">' + r.glyph + '</span><span class="ja">' + r.ja + '</span></a>';
}).join('');

document.getElementById('latest-list').innerHTML = DATA.latest.map(function(l){
  return '<a href="' + l.href + '"><span>' + l.title + '</span><span class="d">' + l.date + '</span></a>';
}).join('');

document.getElementById('about-title').textContent = DATA.about.title;
document.getElementById('about-body').innerHTML = DATA.about.paragraph.join('<br>');
document.getElementById('about-facts').innerHTML = DATA.about.facts.map(function(f){
  return '<div><dt>' + f.label + '</dt><dd>' + f.value + '</dd></div>';
}).join('');
document.getElementById('about-note').textContent = DATA.about.note;
const joinEl = document.getElementById('about-join');
joinEl.href = DATA.about.joinHref;
joinEl.innerHTML = DATA.about.joinLabel + ' &gt;';
document.getElementById('footer-text').textContent = DATA.footer;

document.querySelectorAll('nav a').forEach(function(a){
  a.addEventListener('click', function(){
    document.querySelectorAll('nav a').forEach(function(x){x.classList.remove('active');});
    a.classList.add('active');
    const target = document.getElementById(a.dataset.go);
    if(target) target.scrollIntoView({behavior:'smooth'});
  });
});
document.querySelectorAll('a[href="#about"]').forEach(function(a){
  a.addEventListener('click', function(e){
    e.preventDefault();
    document.querySelector('nav a[data-go="about"]').click();
  });
});

const cards=[...strip.children], dotsEl=document.getElementById('dots');
cards.forEach(function(_, i){
  const d=document.createElement('div'); d.className='dot'+(i===0?' on':'');
  dotsEl.appendChild(d);
});
const dots=[...dotsEl.children];
strip.addEventListener('scroll', function(){
  const center=strip.scrollLeft+strip.clientWidth/2;
  let closest=0,min=Infinity;
  cards.forEach(function(c,i){ const d=Math.abs((c.offsetLeft+c.clientWidth/2)-center); if(d<min){min=d;closest=i;} });
  dots.forEach(function(d,i){ d.classList.toggle('on', i===closest); });
});
let auto=true, idx=0;
strip.addEventListener('pointerdown', function(){ auto=false; });
(function tick(){
  if(auto && cards.length){
    idx=(idx+1)%cards.length;
    strip.scrollTo({left:cards[idx].offsetLeft, behavior:'smooth'});
  }
  setTimeout(tick,3200);
})();
</script>
</body>
</html>
